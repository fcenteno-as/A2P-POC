<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>A2P 10DLC Console — AbsenceSoft OpsAdmin</title>
<link rel="icon" href="assets/Favicon.svg" />
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #FAFAFA; }
  body { font-family: Figtree, sans-serif; color: #252525; }
  a { color: inherit; }
  @keyframes as-spin { to { transform: rotate(360deg); } }
  /* Scrollbar polish */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #D3D3D3; border-radius: 6px; border: 2px solid #FAFAFA; }
  ::-webkit-scrollbar-thumb:hover { background: #A0A0A0; }
  /* Better radios/checkboxes */
  input[type="checkbox"], input[type="radio"] { width: 16px; height: 16px; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <rect width="400" height="400" fill="#074252"/>
    <g transform="translate(120 120)">
      <rect x="0" y="0" width="160" height="160" rx="28" fill="#40A3BD"/>
      <rect x="36" y="50" width="88" height="60" rx="10" fill="#fff"/>
      <circle cx="80" cy="80" r="10" fill="#F16624"/>
      <rect x="60" y="118" width="40" height="8" rx="4" fill="#fff"/>
    </g>
    <text x="200" y="320" font-family="Poppins, sans-serif" font-size="26" font-weight="600" fill="#fff" text-anchor="middle">A2P 10DLC</text>
    <text x="200" y="350" font-family="Figtree, sans-serif" font-size="14" fill="#70C9E9" text-anchor="middle">AbsenceSoft Console</text>
  </svg>
</template>
<div id="root"></div>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="page-overview.jsx"></script>
<script type="text/babel" src="page-customers.jsx"></script>
<script type="text/babel" src="page-customer-detail.jsx"></script>
<script type="text/babel" src="page-wizard.jsx"></script>
<script type="text/babel" src="page-migration.jsx"></script>
<script type="text/babel" src="page-resources.jsx"></script>

<script type="text/babel">
  const { useState } = React;

  function App() {
    const [active, setActive]       = useState("overview");
    const [openCust, setOpenCust]   = useState(null);
    const [wizardOpen, setWizard]   = useState(false);
    const [batchOpen, setBatch]     = useState(false);

    const navigate = (id) => {
      setActive(id);
      setOpenCust(null);
    };

    const openCustomer = (c) => {
      setOpenCust(c);
      setActive("customers");
    };

    // Breadcrumb based on current view
    let crumb = [];
    const labelMap = {
      overview: ["Overview"],
      customers: openCust ? ["Customers", openCust.name] : ["Customers"],
      migration: ["Bulk migration"],
      numbers:   ["Phone numbers"],
      templates: ["Campaign templates"],
      activity:  ["Activity log"],
      settings:  ["Settings"],
    };
    crumb = labelMap[active] || [];

    let content;
    if (active === "overview")  content = <OverviewPage onNavigate={navigate} onOpenCustomer={openCustomer} />;
    if (active === "customers") {
      content = openCust
        ? <CustomerDetailPage customer={openCust} onBack={() => setOpenCust(null)} onOpenWizard={() => setWizard(true)} />
        : <CustomersPage onOpenCustomer={openCustomer} onOpenWizard={() => setWizard(true)} />;
    }
    if (active === "migration") content = <MigrationPage onOpenCustomer={openCustomer} onStartBatch={() => setBatch(true)} />;
    if (active === "numbers")   content = <NumbersPage onOpenCustomer={openCustomer} />;
    if (active === "templates") content = <TemplatesPage />;
    if (active === "activity")  content = <ActivityPage />;
    if (active === "settings")  content = <SettingsPage />;

    return (
      <AppShell active={active} onNavigate={navigate} breadcrumb={crumb}>
        {content}
        <ProvisioningWizard open={wizardOpen} onClose={() => setWizard(false)}
          prefillCustomer={openCust && openCust.status === "NotStarted" ? openCust : null} />
        <StartBatchSheet open={batchOpen} onClose={() => setBatch(false)} />
      </AppShell>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
